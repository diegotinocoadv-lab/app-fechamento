services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    image: fechamento-caixa:latest
    container_name: fechamento-app
    restart: unless-stopped
    env_file: .env.production
    # A app NÃO é publicada direto na internet: só o Nginx fala com ela.
    expose:
      - "3000"
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: fechamento-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Para expor apenas na interface da VPN, troque por: "10.8.0.1:80:80"
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - web

  # Emissão/renovação de certificado HTTPS (Let's Encrypt) — opcional
  certbot:
    image: certbot/certbot
    container_name: fechamento-certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - web

networks:
  web:
    driver: bridge
